<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクスタ特典</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            text-align: center;
        }

        #camera {
            width: 100%;
            height: auto;
        }

        #start {
            margin: 20px;
            padding: 15px 30px;
            font-size: 18px;
        }

        #danceVideo {
            display: none;
            width: 60%;
            position: absolute;
            left: 20%;
            top: 30%;
        }
    </style>
</head>

<body>

    <h2>ARアクスタ</h2>

    <!-- カメラ -->
    <video id="camera" autoplay playsinline></video>

    <br>

    <button id="start">カメラを起動</button>

    <button id="showA">Aを表示</button>

    <!-- ダンス動画 -->
    <video id="danceVideo" autoplay playsinline loop>
        <source src="Aダンス.mp4" type="video/mp4">
    </video>

    <script>

        const camera = document.getElementById("camera");
        const start = document.getElementById("start");
        const showA = document.getElementById("showA");
        const danceVideo = document.getElementById("danceVideo");


        // カメラ起動
        start.addEventListener("click", async () => {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment"
                    }
                });

                camera.srcObject = stream;

            } catch (error) {

                console.error(error);
                alert("カメラを起動できませんでした");

            }

        });


        // Aの動画を表示
        showA.addEventListener("click", () => {

            danceVideo.style.display = "block";
            danceVideo.play();

        });

    </script>

</body>
</html>
