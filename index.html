<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>アクスタ特典</title>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        #danceVideo {
            display: none;
            position: fixed;
            width: 80%;
            left: 10%;
            top: 10%;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="container"></div>

<video id="danceVideo"
       autoplay
       playsinline
       loop>
    <source src="Aダンス.mp4" type="video/mp4">
</video>

<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    import { MindARThree }
        from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


    const mindarThree = new MindARThree({
        container: document.querySelector("#container"),

        imageTargetSrc: "./targets.mind"
    });


    const { renderer, scene, camera } = mindarThree;


    // A画像を認識したとき
    const anchor = mindarThree.addAnchor(0);


    anchor.onTargetFound = () => {

        console.log("A画像を認識しました");

        const video =
            document.querySelector("#danceVideo");

        video.style.display = "block";

        video.play();

    };


    // A画像を見失ったとき
    anchor.onTargetLost = () => {

        console.log("A画像を見失いました");

        const video =
            document.querySelector("#danceVideo");

        video.pause();

        video.style.display = "none";

    };


    // AR開始
    mindarThree.start();


    renderer.setAnimationLoop(() => {

        renderer.render(scene, camera);

    });

</script>

</body>
</html>
