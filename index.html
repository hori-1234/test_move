<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARアクスタ</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #danceVideo {
            display: none;
            position: fixed;
            z-index: 100;
            width: 80%;
            left: 10%;
            top: 10%;
        }
    </style>
</head>

<body>

<a-scene
    mindar-image="imageTargetSrc: ./Atargets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        id="targetA"
        mindar-image-target="targetIndex: 0">
    </a-entity>

</a-scene>

<video
    id="danceVideo"
    src="./Aダンス.mp4"
    playsinline
    loop>
</video>

<script>
    const targetA = document.querySelector("#targetA");
    const danceVideo = document.querySelector("#danceVideo");

    targetA.addEventListener("targetFound", () => {
        console.log("A画像を認識！");
        danceVideo.style.display = "block";
        danceVideo.play();
    });

    targetA.addEventListener("targetLost", () => {
        console.log("A画像を見失った");
        danceVideo.pause();
        danceVideo.style.display = "none";
    });
</script>

</body>
</html>
