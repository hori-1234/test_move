<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>アクスタ特典</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            text-align: center;
        }

        #camera {
            width: 100%;
            height: auto;
        }

        #start {
            margin: 20px;
            padding: 15px 30px;
            font-size: 18px;
        }

        #danceVideo {
            display: none;
            width: 80%;
            position: absolute;
            left: 10%;
            top: 20%;
        }
    </style>
</head>

<body>

    <h2>ARアクスタ</h2>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button id="start">カメラを起動</button>

    <video id="danceVideo" autoplay playsinline loop>
        <source src="Aダンス.mp4" type="video/mp4">
    </video>

    <script>

        const camera = document.getElementById("camera");
        const start = document.getElementById("start");
        const danceVideo = document.getElementById("danceVideo");

        start.addEventListener("click", async () => {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "environment"
                        }
                    });

                camera.srcObject = stream;

            } catch (error) {

                console.error(error);

                alert("カメラを起動できませんでした");

            }

        });

    </script>

</body>
</html>
